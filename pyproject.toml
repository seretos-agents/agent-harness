[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness_plugin"
version = "0.0.0"
description = "Provider-independent subagent system for coding agents - replaces the host's built-in subagent tool calls."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "mcp>=1.2,<2",
  "lib-python-harness @ git+https://github.com/seretos-agents/lib-python-harness@v0.0.9",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: needs the real `claude` CLI; deselected by default, run with `python -m pytest -m live`",
]
# thread-based timeout (not the "signal" default): signal-based timeouts don't
# work on Windows and can't interrupt blocking I/O, thread-based can. A test
# stuck in a stdio-pipe deadlock (ticket #25) is killed after 60s with a
# stack trace instead of silently eating the whole CI job's timeout-minutes.
timeout = 60
timeout_method = "thread"
# faulthandler_timeout (pytest's builtin faulthandler plugin, ini-option only
# -- there is no `--faulthandler-timeout` CLI flag) fires 10s before the
# timeout above: it dumps every thread's Python frame stack to the log via
# introspection, which works even when the blocked thread is stuck inside a
# syscall and never returns control to the interpreter -- unlike
# timeout_method="thread" above, which needs the interpreter to run a
# bytecode instruction to notice the interrupt at all.
faulthandler_timeout = 50
