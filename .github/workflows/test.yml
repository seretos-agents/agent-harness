name: tests

# Runs pytest on every PR. Distinct from release.yml, which is
# workflow_dispatch-driven and produces the OS-specific binaries / release zip.
#
# Deliberately `pull_request:` only, not also `push:` — every commit on an
# open PR already fires `pull_request` (opened/synchronize/reopened), so a
# branch-scoped `push:` trigger alongside it doubled every run (two parallel
# "tests" workflow runs per commit, `event: pull_request` and `event: push`,
# racing each other for no benefit). The quality gate is "every PR runs the
# full suite" — this still guarantees that; it just stops running it twice.
#
# OS_TARGETS default: [windows, linux]. If the plugin is genuinely Windows-only
# (e.g. depends on Win32 / COM, like agent-vdesktop), drop ubuntu-22.04 from
# the matrix and switch release.yml to a single-OS pipeline — see AGENTS.md
# "OS_TARGETS" for the Windows-only override.
on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Not a hang: a real `-s` run (ticket #25) showed steady progress the whole
    # time, just slow — each test spawns a real `python -m harness_plugin`
    # subprocess (plus its own child) over stdio, and Windows CI runners pay a
    # heavy per-spawn tax (real-time AV scanning of every new process image)
    # that Linux doesn't. A known-good Linux run finishes in ~99s; the same
    # suite genuinely needs ~11 minutes on Windows. 10 was already too tight
    # before this ticket touched it; 20 matches the `build` job's own budget
    # below and gives real margin above the observed Windows duration.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install plugin + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        shell: bash
        run: python -m pytest

  # Frozen-binary check: builds the PyInstaller binary and smoke-tests it with a
  # real MCP initialize + tools/list (fails if lib_python_harness is not bundled).
  build:
    strategy:
      fail-fast: false
      matrix:
        # include: form (not os: [...] + extra include) so the 5.1 row is its
        # own job instead of being merged into the windows-latest combination.
        # `launcher` is the PowerShell host that runs build.ps1: powershell.exe
        # is Windows PowerShell 5.1, pwsh is PowerShell 7 / Linux pwsh.
        include:
          - os: windows-latest
            launcher: pwsh
          - os: windows-latest
            launcher: powershell.exe
          - os: ubuntu-22.04
            launcher: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # #53 R1/R2 (tests/test_launch_commands.py) drives the manifests'
      # extensionless launch command through a real Node `child_process.spawn`
      # -- Claude Code's own MCP launcher runtime and libuv path resolution.
      # Node is a test-only dependency here; the dispatcher itself is /bin/sh.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and smoke-test the binary
        shell: pwsh
        run: ${{ matrix.launcher }} -File scripts/build.ps1

      - name: Run the wait + launch-command tests against the frozen binary
        shell: pwsh
        run: |
          python -m pip install -e ".[test]"
          # #53: the bin/ name this build produced -- harness.exe on Windows,
          # the renamed harness-linux on Linux (bin/harness itself is now the
          # committed POSIX dispatcher, not build output).
          $bin = if ($IsWindows) { "bin/harness.exe" } else { "bin/harness-linux" }
          $env:HARNESS_BIN = (Resolve-Path $bin).Path
          python -m pytest tests/test_wait_run.py tests/test_launch_commands.py tests/test_run_agent.py
